{# Fixed bottom navigation with the floating Add button. Pages set active_tab. #}
<div class="fixed inset-x-0 bottom-0 z-20 mx-auto max-w-md">
  <a href="{% url 'entry_add' %}" aria-label="Add entry"
     class="absolute -top-18 right-4 flex size-14 items-center justify-center rounded-full bg-brand-600 text-white shadow-lg shadow-brand-600/30 active:bg-brand-700">
    <svg class="size-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </a>
  <nav aria-label="Main" class="grid grid-cols-5 border-t border-slate-200 bg-white pb-[env(safe-area-inset-bottom)]">
    <a href="{% url 'home' %}" {% if active_tab == 'home' %}aria-current="page"{% endif %}
       class="flex min-h-14 flex-col items-center justify-center gap-0.5 px-1 text-center text-[11px] leading-tight font-medium {% if active_tab == 'home' %}text-brand-700{% else %}text-slate-500{% endif %}">
      <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span class="whitespace-nowrap">Home</span>
    </a>
    <a href="{% url 'entries' %}" {% if active_tab == 'entries' %}aria-current="page"{% endif %}
       class="flex min-h-14 flex-col items-center justify-center gap-0.5 px-1 text-center text-[11px] leading-tight font-medium {% if active_tab == 'entries' %}text-brand-700{% else %}text-slate-500{% endif %}">
      <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
      <span class="whitespace-nowrap">Entries</span>
    </a>
    <a href="{% url 'people' %}" {% if active_tab == 'people' %}aria-current="page"{% endif %}
       class="flex min-h-14 flex-col items-center justify-center gap-0.5 px-1 text-center text-[11px] leading-tight font-medium {% if active_tab == 'people' %}text-brand-700{% else %}text-slate-500{% endif %}">
      <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.2a6.5 6.5 0 0 1 3.5 5.8"/></svg>
      <span class="whitespace-nowrap">People</span>
    </a>
    <a href="{% url 'deals' %}" {% if active_tab == 'deals' %}aria-current="page"{% endif %}
       class="flex min-h-14 flex-col items-center justify-center gap-0.5 px-1 text-center text-[11px] leading-tight font-medium {% if active_tab == 'deals' %}text-brand-700{% else %}text-slate-500{% endif %}">
      <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg>
      <span class="whitespace-nowrap">Deals &amp; Funds</span>
    </a>
    <a href="{% url 'more' %}" {% if active_tab == 'more' %}aria-current="page"{% endif %}
       class="flex min-h-14 flex-col items-center justify-center gap-0.5 px-1 text-center text-[11px] leading-tight font-medium {% if active_tab == 'more' %}text-brand-700{% else %}text-slate-500{% endif %}">
      <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg>
      <span class="whitespace-nowrap">More</span>
    </a>
  </nav>
</div>
